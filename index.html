<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox - Salto y Modulos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Sandbox de Movimiento</h2>

    <div class="options">
        
        <div class="selector-piso-container">
            <label for="selectorPiso">Piso</label>
            <select id="selectorPiso"></select>
        </div>
        
        <div class="selector-container">
            <button id="btnPersonaje1" class="btn-personaje activo" onclick="seleccionarPersonaje('personaje1')">Juan</button>
            <button id="btnPersonaje2" class="btn-personaje" onclick="seleccionarPersonaje('personaje2')">Ame</button>
        </div>

        <label class="opcion-colisiones" title="Tecla C">
            <input type="checkbox" id="chkColisiones"> Ver colisiones <kbd>C</kbd>
        </label>
        
    </div>
    
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    
    <div class="controles">
        <p>Flechas [ Izquierda / Derecha ] para correr | [ Barra Espaciadora ] para saltar | [ C ] ver colisiones</p>
    </div>

    <!-- Cargamos los módulos en orden lógico -->
    <script src="personajes.js"></script>
    <script src="controles.js"></script>
    <script src="niveles_base.js"></script>
    <script src="niveles.js"></script>
    <script src="escenario.js"></script>
    <script src="motor.js"></script>
</body>
</html>
